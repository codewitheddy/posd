version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pos_system
      - POSTGRES_USER=pos_user
      - POSTGRES_PASSWORD=pos_password
    ports:
      - "5432:5432"

  web:
    build: .
    command: gunicorn pos_system.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-dev-key-change-in-production
      - DATABASE_URL=postgresql://pos_user:pos_password@db:5432/pos_system
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
