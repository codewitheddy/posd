{% extends 'hr/base_hr.html' %}
{% block title %}{% if is_edit %}Edit Department{% else %}Create Department{% endif %}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1><i class="bi bi-diagram-3 me-2 text-primary"></i>{% if is_edit %}Edit Department{% else %}Create Department{% endif %}</h1>
  </div>
  <a href="{% url 'hr_department_list' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Departments</a>
</div>

<div class="row justify-content-center">
<div class="col-md-6">
<div class="form-card">
<form method="POST">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label small fw-bold">Department Name <span class="text-danger">*</span></label>
    <input type="text" name="name" class="form-control" value="{{ department.name|default:'' }}" required placeholder="e.g. Finance &amp; Accounting">
  </div>
  <div class="mb-3">
    <label class="form-label small fw-bold">Department Manager</label>
    <select name="manager" class="form-select">
      <option value="">-- No Manager Assigned --</option>
      {% for e in employees %}
        <option value="{{ e.pk }}" {% if department.manager_id == e.pk %}selected{% endif %}>{{ e.get_full_name }} ({{ e.job_title }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label small fw-bold">Description</label>
    <textarea name="description" class="form-control" rows="3" placeholder="Department duties and remit...">{{ department.description|default:'' }}</textarea>
  </div>
  <div class="d-flex gap-2 pt-2 border-top">
    <button type="submit" class="btn btn-hr-primary px-4"><i class="bi bi-check-circle me-1"></i>{% if is_edit %}Save Changes{% else %}Create Department{% endif %}</button>
    <a href="{% url 'hr_department_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
</div>
{% endblock %}
