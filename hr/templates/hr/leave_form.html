{% extends 'hr/base_hr.html' %}
{% block title %}Apply for Leave{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1><i class="bi bi-calendar-plus me-2 text-primary"></i>Apply for Leave</h1>
    <p class="page-subtitle">Submit leave request for approval per statutory entitlement rules.</p>
  </div>
  <a href="{% url 'hr_leave_list' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Leave Register</a>
</div>

<div class="row justify-content-center">
<div class="col-md-7">
<div class="form-card">
<form method="POST">{% csrf_token %}
  {% if is_manager and employees %}
  <div class="mb-3">
    <label class="form-label small fw-bold">Employee <span class="text-danger">*</span></label>
    <select name="employee_id" class="form-select">
      {% for e in employees %}
        <option value="{{ e.pk }}">{{ e.get_full_name }} ({{ e.job_title }})</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <div class="mb-3">
    <label class="form-label small fw-bold">Leave Classification <span class="text-danger">*</span></label>
    <select name="leave_type" class="form-select" required>
      <option value="annual">Annual Leave (21 Working Days Statutory Min)</option>
      <option value="sick">Sick Leave (30 Days Full Pay / 15 Days Half Pay)</option>
      <option value="maternity">Maternity Leave (3 Months Paid)</option>
      <option value="paternity">Paternity Leave (2 Weeks Paid)</option>
      <option value="emergency">Compassionate / Emergency Leave</option>
      <option value="study">Study / Examination Leave</option>
      <option value="unpaid">Unpaid Leave</option>
    </select>
  </div>
  
  <div class="row g-3 mb-3">
    <div class="col-6">
      <label class="form-label small fw-bold">Commencement Date <span class="text-danger">*</span></label>
      <input type="date" name="start_date" class="form-control" required>
    </div>
    <div class="col-6">
      <label class="form-label small fw-bold">Resumption / End Date <span class="text-danger">*</span></label>
      <input type="date" name="end_date" class="form-control" required>
    </div>
  </div>
  
  <div class="mb-3">
    <label class="form-label small fw-bold">Reason / Justification <span class="text-danger">*</span></label>
    <textarea name="reason" class="form-control" rows="3" required placeholder="State reason, handover notes, or medical certificate reference..."></textarea>
  </div>
  
  <div class="d-flex gap-2 pt-2 border-top">
    <button type="submit" class="btn btn-hr-primary px-4"><i class="bi bi-send me-1"></i>Submit Application</button>
    <a href="{% url 'hr_leave_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
</div>
{% endblock %}
