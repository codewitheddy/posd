# ==============================================================================
# Production Nginx Configuration for Marid POS (10 Branches × 10 Selling Points)
# Features: HTTP/2, Unbuffered SSE Streaming for 100+ Terminals, SSL & Compression
# ==============================================================================

upstream pos_app {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Rate limiting zone (50 requests/second with burst 100)
limit_req_zone $binary_remote_addr zone=pos_api_limit:10m rate=50r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name marid.co.ke www.marid.co.ke pos.marid.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marid.co.ke www.marid.co.ke pos.marid.co.ke;

    # SSL Certificates (Let's Encrypt / Custom)
    ssl_certificate /etc/letsencrypt/live/marid.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marid.co.ke/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/marid.co.ke/chain.pem;

    # SSL Security & Performance
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Client Request Settings
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ==================== STATIC & MEDIA ASSETS ====================
    location /static/ {
        alias /var/www/pos/posd/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /var/www/pos/posd/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ==================== CRITICAL: REAL-TIME SSE SYNC STREAM ====================
    # Unbuffered streaming endpoint for persistent Front Office POS connections
    location /pos/api/sync/stream/ {
        proxy_pass http://pos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so SSE events push instantaneously to registers
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ==================== HIGH-THROUGHPUT CHECKOUT & CATALOG ====================
    location /pos/api/ {
        limit_req zone=pos_api_limit burst=100 nodelay;
        proxy_pass http://pos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ==================== MAIN WEB APPLICATION ====================
    location / {
        proxy_pass http://pos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
