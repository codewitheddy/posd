services:
  # Web Service
  - type: web
    name: pos-system
    runtime: python
    plan: free  # Change to 'starter' for production
    buildCommand: "./build.sh"
    startCommand: "gunicorn pos_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
    autoDeploy: true

  # PostgreSQL Database
  - type: pgsql
    name: pos-db
    plan: free  # Free tier includes 90 days, then $7/month
    databaseName: pos_system
    databaseUser: pos_user
