# Marid POS Backup Configuration
# This file contains backup settings and schedules

[BACKUP_SETTINGS]
# Backup directory (relative to project root)
backup_dir = backups

# Retention periods (in days)
daily_retention = 30
weekly_retention = 90
monthly_retention = 365

# Backup verification settings
verify_backups = true
comprehensive_verification = false

# Cloud storage settings (optional)
cloud_storage_enabled = false
cloud_provider = s3  # s3, gcs, azure
cloud_bucket = your-backup-bucket
cloud_region = us-east-1

# Email notifications
email_notifications = true
alert_email = admin@marid.co.ke

# Encryption settings (optional)
encrypt_backups = false
encryption_key = your-encryption-key

[BACKUP_SCHEDULES]
# Cron-style schedules for automated backups

# Daily backup at 2 AM
daily_schedule = 0 2 * * *

# Weekly backup on Sunday at 3 AM
weekly_schedule = 0 3 * * 0

# Monthly backup on 1st at 4 AM
monthly_schedule = 0 4 1 * *

[MONITORING]
# Backup monitoring settings

# Alert if no backup in X hours
max_backup_age_hours = 25

# Alert if backup size changes by more than X%
backup_size_change_threshold = 50

# Health check schedule (cron format)
health_check_schedule = 0 */6 * * *  # Every 6 hours

[RECOVERY]
# Recovery settings

# Auto-recovery attempts
max_recovery_attempts = 3

# Recovery timeout (minutes)
recovery_timeout_minutes = 60

# Post-recovery verification
verify_after_recovery = true</content>
