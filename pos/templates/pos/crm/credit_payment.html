{% extends 'pos/base.html' %}
{% block title %}Record Payment — {{ customer.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="form-card">
        <div class="form-card-header">
          <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Record Credit Payment</h5>
          <p class="text-muted small mb-0">{{ customer.name }} — Outstanding: <strong class="text-danger">KES {{ customer.credit_balance|floatformat:2 }}</strong></p>
        </div>
        <div class="form-card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Amount (KES) <span class="text-danger">*</span></label>
              <input type="number" name="amount" class="form-control" step="0.01" min="0.01" max="{{ customer.credit_balance }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Payment Method</label>
              <select name="payment_method" class="form-select">
                <option value="">— Select —</option>
                {% for pm in payment_methods %}<option value="{{ pm.pk }}">{{ pm.name }}</option>{% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Reference (M-Pesa / Cheque)</label>
              <input type="text" name="reference" class="form-control" placeholder="e.g. QA12345">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Notes</label>
              <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Record Payment</button>
              <a href="{% url 'customer_credit_detail' slug=business_slug pk=customer.pk %}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
