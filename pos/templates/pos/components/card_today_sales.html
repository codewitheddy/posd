<div class="{{ card.width }}">
    <div class="card shadow-sm border-0 h-100 border-start border-primary border-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col">
                    <div class="text-xs fw-bold text-primary text-uppercase mb-1">Today's Sales (POS)</div>
                    <div class="h5 mb-0 fw-bold text-gray-800">KES {{ today_sales_total|default:"0.00" }}</div>
                    <div class="small text-muted mt-1">{{ today_sales_count|default:0 }} transactions recorded</div>
                </div>
                <div class="col-auto">
                    <i class="bi bi-cart-check-fill text-gray-300 fs-1"></i>
                </div>
            </div>
        </div>
    </div>
</div>
