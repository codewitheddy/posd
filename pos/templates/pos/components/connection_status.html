<!-- Connection Status Indicator (Inline in Topbar) -->
<script>
// Connection Status Manager (Inline Version)
(function() {
    const statusElement = document.getElementById('connectionStatus');
    
    if (!statusElement) return;

    let _isOnline = true; // tracked state

    // Real connectivity check via fetch ping
    async function checkRealConnectivity() {
        try {
            const res = await fetch('/ping/?_=' + Date.now(), {
                method: 'HEAD',
                cache: 'no-store',
                signal: AbortSignal.timeout(4000)
            });
            return res.ok || res.status < 500;
        } catch {
            return false;
        }
    }
    
    // Update connection status
    async function updateConnectionStatus(notify) {
        const wasOnline = _isOnline;
        _isOnline = await checkRealConnectivity();
        
        if (_isOnline) {
            statusElement.classList.remove('offline');
            statusElement.setAttribute('data-status', 'Online');
            statusElement.querySelector('i').className = 'fas fa-wifi';
        } else {
            statusElement.classList.add('offline');
            statusElement.setAttribute('data-status', 'Offline');
            statusElement.querySelector('i').className = 'fas fa-wifi-slash';
        }

        if (notify && wasOnline !== _isOnline) {
            showConnectionNotification(_isOnline);
        }

        // Expose real status for sync-manager
        window._realOnline = _isOnline;
    }
    
    // Show notification when connection changes
    function showConnectionNotification(isOnline) {
        const toast = document.createElement('div');
        toast.className = `alert alert-${isOnline ? 'success' : 'warning'} alert-dismissible fade show`;
        toast.style.position = 'fixed';
        toast.style.top = '80px';
        toast.style.right = '20px';
        toast.style.zIndex = '9999';
        toast.style.minWidth = '250px';
        toast.innerHTML = `
            <i class="fas fa-${isOnline ? 'wifi' : 'wifi-slash'}"></i>
            <strong>${isOnline ? 'Back Online' : 'Connection Lost'}</strong>
            <p class="mb-0 small">${isOnline ? 'You are now connected' : 'Working in offline mode'}</p>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(toast);
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
    }
    
    // Listen for browser online/offline events as triggers for re-check
    window.addEventListener('online', () => updateConnectionStatus(true));
    window.addEventListener('offline', () => updateConnectionStatus(true));
    
    // Initial check
    updateConnectionStatus(false);
    
    // Re-check every 15 seconds
    setInterval(() => updateConnectionStatus(true), 15000);
    
    window.ConnectionStatus = {
        isOnline: () => window._realOnline,
        updateStatus: () => updateConnectionStatus(true)
    };
})();
</script>
