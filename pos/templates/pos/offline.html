<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Marid POS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      background: #fef3c7;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 10px; }
    p  { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #224195; color: #fff; border: none;
      border-radius: 8px; padding: 11px 24px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: background .15s;
    }
    .btn:hover { background: #1a3278; }
    .status {
      margin-top: 24px; font-size: 12px; color: #9ca3af;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f59e0b; display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>
      No internet connection detected. Any sales made will be saved locally
      and automatically synced when you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      ↺ Try again
    </button>
    <div class="status">
      <span class="dot"></span> Waiting for connection…
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
