{% extends 'pos/base.html' %}
{% block title %}Delete Expense{% endblock %}
{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
<div class="row justify-content-center">
<div class="col-12 col-md-5">
  <div class="card border-0 shadow-sm" style="border-radius:14px">
    <div class="card-body p-4 text-center">
      <div style="width:60px;height:60px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;color:#dc2626">
        <i class="bi bi-trash"></i>
      </div>
      <h5 class="fw-bold mb-1">Delete Expense?</h5>
      <p class="text-muted small mb-3">This will permanently delete <strong>{{ expense.expense_number }}</strong> — {{ expense.description }} (KES {{ expense.amount|floatformat:0 }})</p>
      <form method="post" class="d-flex gap-2 justify-content-center">
        {% csrf_token %}
        <a href="{% url 'expense_list' slug=request.business.slug %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
      </form>
    </div>
  </div>
</div>
</div>
</div>
{% endblock %}
