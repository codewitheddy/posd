{% extends 'pos/base.html' %}
{% block title %}{% if is_edit %}Edit Department{% else %}New Department{% endif %}{% endblock %}
{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
<div class="page-header">
  <div><h1><i class="bi bi-diagram-3 me-2 text-primary"></i>{% if is_edit %}Edit: {{ department.name }}{% else %}New Department{% endif %}</h1></div>
  <a href="{% url 'hr_department_list' slug=request.business.slug %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
<div class="col-md-6">
<div class="form-card">
<form method="POST">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Department Name <span class="text-danger">*</span></label>
    <input type="text" name="name" class="form-control" value="{{ department.name|default:'' }}" required placeholder="e.g. Sales, Operations, Finance">
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="2" placeholder="Optional description">{{ department.description|default:'' }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Department Manager</label>
    <select name="manager" class="form-select">
      <option value="">-- No manager --</option>
      {% for e in employees %}
      <option value="{{ e.pk }}" {% if department.manager_id == e.pk %}selected{% endif %}>
        {{ e.get_full_name }} — {{ e.job_title }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>{% if is_edit %}Save{% else %}Create Department{% endif %}</button>
    <a href="{% url 'hr_department_list' slug=request.business.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
