{% extends 'pos/base.html' %}
{% block title %}New Disciplinary Record{% endblock %}
{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
<div class="page-header">
  <div><h1><i class="bi bi-exclamation-triangle me-2 text-primary"></i>New Disciplinary Record</h1></div>
  <a href="{% url 'hr_disciplinary_list' slug=request.business.slug %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
<div class="col-md-7">
<div class="form-card">
<form method="POST">{% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Employee <span class="text-danger">*</span></label>
      <select name="employee" class="form-select" required>
        <option value="">-- Select employee --</option>
        {% for e in employees %}<option value="{{ e.pk }}">{{ e.get_full_name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Incident Date <span class="text-danger">*</span></label>
      <input type="date" name="incident_date" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Incident Type <span class="text-danger">*</span></label>
      <select name="incident_type" class="form-select" required>
        <option value="warning">Warning</option>
        <option value="suspension">Suspension</option>
        <option value="termination">Termination</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Description <span class="text-danger">*</span></label>
      <textarea name="description" class="form-control" rows="3" required placeholder="Describe the incident"></textarea>
    </div>
    <div class="col-12">
      <label class="form-label">Action Taken <span class="text-danger">*</span></label>
      <textarea name="action_taken" class="form-control" rows="2" required placeholder="What action was taken"></textarea>
    </div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Record</button>
    <a href="{% url 'hr_disciplinary_list' slug=request.business.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
