{% extends 'pos/base.html' %}
{% block title %}Request Leave{% endblock %}
{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
<div class="page-header">
  <div><h1><i class="bi bi-calendar-plus me-2 text-primary"></i>Request Leave</h1></div>
  <a href="{% url 'hr_leave_list' slug=request.business.slug %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
<div class="col-md-6">
<div class="form-card">
<form method="POST">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Leave Type <span class="text-danger">*</span></label>
    <select name="leave_type" class="form-select" required>
      <option value="annual">Annual Leave</option>
      <option value="sick">Sick Leave</option>
      <option value="emergency">Emergency Leave</option>
      <option value="unpaid">Unpaid Leave</option>
    </select>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6">
      <label class="form-label">Start Date <span class="text-danger">*</span></label>
      <input type="date" name="start_date" class="form-control" required>
    </div>
    <div class="col-6">
      <label class="form-label">End Date <span class="text-danger">*</span></label>
      <input type="date" name="end_date" class="form-control" required>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Reason <span class="text-danger">*</span></label>
    <textarea name="reason" class="form-control" rows="3" required placeholder="Briefly describe the reason for leave"></textarea>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Request</button>
    <a href="{% url 'hr_leave_list' slug=request.business.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
