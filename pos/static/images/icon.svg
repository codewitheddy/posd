<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#4e73df" rx="80"/>
  
  <!-- POS Terminal Screen -->
  <rect x="140" y="120" width="232" height="160" fill="#ffffff" rx="8"/>
  <rect x="150" y="130" width="212" height="120" fill="#e8f0fe" rx="4"/>
  
  <!-- Screen Lines (representing text/data) -->
  <line x1="170" y1="150" x2="342" y2="150" stroke="#4e73df" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="175" x2="300" y2="175" stroke="#4e73df" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="200" x2="320" y2="200" stroke="#4e73df" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="225" x2="280" y2="225" stroke="#4e73df" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Keypad Base -->
  <rect x="140" y="290" width="232" height="102" fill="#ffffff" rx="8"/>
  
  <!-- Keypad Buttons (3x3 grid) -->
  <circle cx="180" cy="320" r="12" fill="#4e73df"/>
  <circle cx="220" cy="320" r="12" fill="#4e73df"/>
  <circle cx="260" cy="320" r="12" fill="#4e73df"/>
  <circle cx="300" cy="320" r="12" fill="#4e73df"/>
  <circle cx="340" cy="320" r="12" fill="#4e73df"/>
  
  <circle cx="180" cy="360" r="12" fill="#4e73df"/>
  <circle cx="220" cy="360" r="12" fill="#4e73df"/>
  <circle cx="260" cy="360" r="12" fill="#4e73df"/>
  <circle cx="300" cy="360" r="12" fill="#4e73df"/>
  <circle cx="340" cy="360" r="12" fill="#4e73df"/>
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(380, 140)">
    <path d="M 0 0 L 8 0 L 12 24 L 40 24" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="32" r="4" fill="#ffffff"/>
    <circle cx="36" cy="32" r="4" fill="#ffffff"/>
    <path d="M 12 8 L 44 8 L 40 24 L 12 24 Z" fill="#ffffff"/>
  </g>
  
  <!-- Currency Symbol -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">KES</text>
</svg>
